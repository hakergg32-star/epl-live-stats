<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Match Prediction AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            font-size: 24px;
        }
        .status-box {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #0369a1;
        }
        .prediction-result {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ Football Match Prediction AI</h1>
        
        <div class="status-box" id="server-status">
            Checking server status...
        </div>

        <button class="btn" onclick="getPrediction()">ပွဲစဉ်ခန့်မှန်းချက် ကြည့်ရန်</button>

        <div class="prediction-result" id="result-box" style="display: none;">
            <h3>ခန့်မှန်းချက် ရလဒ်များ:</h3>
            <p id="prediction-text">ခဏစောင့်ပါ...</p>
        </div>
    </div>

    <script>
        // Server Status စစ်ဆေးခြင်း
        fetch('/api')
            .then(res => res.json())
            .then(data => {
                document.getElementById('server-status').innerHTML = 
                    `<b>Status:</b> <span style="color: #4ade80;">${data.status}</span><br><b>Message:</b> ${data.message}`;
            })
            .catch(err => {
                document.getElementById('server-status').innerHTML = 
                    `<span style="color: #f87171;">Server ချိတ်ဆက်မှု မအောင်မြင်ပါ။</span>`;
            });

        // AI ဖြင့် ပွဲခန့်မှန်းချက် ထုတ်ယူရန်
        
function getPrediction() {
    const resultBox = document.getElementById('result-box');
    const predictionText = document.getElementById('prediction-text');

    const teams = [
        "Manchester United", "Liverpool",
        "Arsenal", "Chelsea",
        "Manchester City", "Tottenham",
        "Real Madrid", "Barcelona",
        "Bayern Munich", "PSG",
        "Inter Milan", "AC Milan"
    ];

    const home = prompt(
        "အိမ်ရှင်အသင်းကို ရွေးပါ:\n" +
        teams.map((t, i) => (i + 1) + ". " + t).join("\n") +
        "\n\nအသင်းနံပါတ် ရိုက်ထည့်ပါ"
    );

    if (home === null) return;

    const homeIndex = Number(home) - 1;

    if (!Number.isInteger(homeIndex) ||
        homeIndex < 0 || homeIndex >= teams.length) {
        alert("အသင်းနံပါတ် မှန်မှန်ထည့်ပါ");
        return;
    }

    const awayTeams = teams.filter(
        (t, i) => i !== homeIndex
    );

    const away = prompt(
        "ဧည့်သည်အသင်းကို ရွေးပါ:\n" +
        awayTeams.map((t, i) => (i + 1) + ". " + t).join("\n") +
        "\n\nအသင်းနံပါတ် ရိုက်ထည့်ပါ"
    );

    if (away === null) return;

    const awayIndex = Number(away) - 1;

    if (!Number.isInteger(awayIndex) ||
        awayIndex < 0 || awayIndex >= awayTeams.length) {
        alert("အသင်းနံပါတ် မှန်မှန်ထည့်ပါ");
        return;
    }

    const awayTeam = awayTeams[awayIndex];

    const homeChance = Math.floor(Math.random() * 31) + 35;
    const awayChance = Math.floor(Math.random() * (66 - homeChance));
    const drawChance = 100 - homeChance - awayChance;

    resultBox.style.display = 'block';

    predictionText.innerHTML =
        "ပွဲစဉ်: " + teams[homeIndex] +
        " vs " + awayTeam +
        "<br><br><b>စမ်းသပ်ခန့်မှန်းချက်</b><br>" +
        teams[homeIndex] + " နိုင်နိုင်ခြေ: " + homeChance + "%<br>" +
        "သရေကျနိုင်ခြေ: " + drawChance + "%<br>" +
        awayTeam + " နိုင်နိုင်ခြေ: " + awayChance + "%<br><br>" +
        "<small>ဤရလဒ်သည် ကျပန်းထုတ်ပေးသော Demo ဖြစ်ပြီး " +
        "တကယ့် AI ခန့်မှန်းချက် မဟုတ်ပါ။</small>";
}

        }
    </script>

</body>
</html
